<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>Nouveau rendez-vous</title>
  <style>
    :root { color-scheme: light dark; }
    @media (prefers-color-scheme: dark) {
      .page { background-color: #0f172a !important; }
      .card { background-color: #1e293b !important; border-color: #334155 !important; }
      .recap { background-color: #0f172a !important; }
      .rule { border-color: #334155 !important; }
      .text { color: #f1f5f9 !important; }
      .muted { color: #cbd5e1 !important; }
      .link { color: #a5b4fc !important; border-color: #a5b4fc !important; }
      .footer { color: #94a3b8 !important; }
    }
  </style>
</head>
<body class="page" style="margin:0;padding:0;background-color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
<table role="presentation" class="page" style="width:100%;border-spacing:0;background-color:#f8fafc;padding:40px 16px;">
<tr><td style="text-align:center;">
<table role="presentation" style="width:100%;max-width:600px;border-spacing:0;margin:0 auto;">
  <!-- Header -->
  <tr><td style="text-align:center;padding-bottom:24px;">
    <span class="text" style="color:#1e293b;font-size:24px;font-weight:700;">Julien N.</span>
  </td></tr>
  <!-- Title -->
  <tr><td style="text-align:center;padding-bottom:24px;">
    <span style="background-color:#4f46e5;border:2px solid #4f46e5;color:#ffffff;padding:8px 20px;border-radius:20px;font-size:14px;font-weight:600;display:inline-block;">
      &#128197; Nouveau rendez-vous
    </span>
  </td></tr>
  <!-- Card -->
  <tr><td class="card" style="background-color:#ffffff;border:1px solid #94a3b8;border-radius:16px;overflow:hidden;">
    <table role="presentation" style="width:100%;border-spacing:0;">
      <tr><td style="height:4px;background-color:#4f46e5;font-size:0;line-height:0;">&nbsp;</td></tr>
      <tr><td style="padding:32px 24px;text-align:left;">
        <p class="muted" style="color:#475569;font-size:14px;line-height:1.6;margin:0 0 24px;">Un visiteur a r&#233;serv&#233; un appel de cadrage.</p>
        <!-- Details -->
        <table role="presentation" style="width:100%;border-spacing:0;margin-bottom:24px;">
          <tr>
            <td class="rule" style="padding:12px 16px;border-bottom:1px solid #94a3b8;vertical-align:top;"><span class="muted" style="color:#475569;font-size:13px;">Date</span></td>
            <td class="rule" style="padding:12px 16px;border-bottom:1px solid #94a3b8;text-align:right;"><span class="text" style="color:#1e293b;font-size:14px;font-weight:500;">{{when}}</span></td>
          </tr>
          <tr>
            <td class="rule" style="padding:12px 16px;border-bottom:1px solid #94a3b8;vertical-align:top;"><span class="muted" style="color:#475569;font-size:13px;">{{meetingLabel}}</span></td>
            <td class="rule" style="padding:12px 16px;border-bottom:1px solid #94a3b8;text-align:right;"><a class="link" href="{{meetingHref}}" style="color:#4338ca;font-size:14px;text-decoration:underline;word-break:break-all;">{{meetingValue}}</a></td>
          </tr>
          <tr>
            <td class="rule" style="padding:12px 16px;border-bottom:1px solid #94a3b8;vertical-align:top;"><span class="muted" style="color:#475569;font-size:13px;">Nom</span></td>
            <td class="rule" style="padding:12px 16px;border-bottom:1px solid #94a3b8;text-align:right;"><span class="text" style="color:#1e293b;font-size:14px;font-weight:500;">{{name}}</span></td>
          </tr>
          <tr>
            <td class="rule" style="padding:12px 16px;border-bottom:1px solid #94a3b8;vertical-align:top;"><span class="muted" style="color:#475569;font-size:13px;">Email</span></td>
            <td class="rule" style="padding:12px 16px;border-bottom:1px solid #94a3b8;text-align:right;"><a class="link" href="mailto:{{email}}" style="color:#4338ca;font-size:14px;text-decoration:underline;word-break:break-all;">{{email}}</a></td>
          </tr>
          <tr>
            <td style="padding:12px 16px;vertical-align:top;"><span class="muted" style="color:#475569;font-size:13px;">Soci&#233;t&#233;</span></td>
            <td style="padding:12px 16px;text-align:right;"><span class="text" style="color:#1e293b;font-size:14px;font-weight:500;">{{company}}</span></td>
          </tr>
        </table>
        <!-- Message -->
        <table role="presentation" class="recap" style="width:100%;border-spacing:0;background-color:#f1f5f9;border:1px solid #94a3b8;border-radius:12px;margin-bottom:24px;">
          <tr><td style="padding:20px;">
            <p class="muted" style="color:#475569;font-size:12px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;margin:0 0 8px;">Message</p>
            <p class="text" style="color:#1e293b;font-size:14px;line-height:1.6;margin:0;white-space:pre-wrap;">{{message}}</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </td></tr>
  <!-- Footer -->
  <tr><td style="text-align:center;padding-top:32px;">
    <p class="footer" style="color:#475569;font-size:12px;margin:0;">&#169; {{year}} Julien N&#233;dellec. Tous droits r&#233;serv&#233;s.</p>
  </td></tr>
</table>
</td></tr>
</table>
</body>
</html>
